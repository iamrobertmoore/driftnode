# Vendor-contract conformance.
#
# The generated node was built against a snapshot of the vendor's API contract.
# This workflow re-checks that contract against the live API on a schedule, so
# upstream drift surfaces here rather than in a user's failing workflow at 3am.
name: Conformance

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/n8n-nodes-vultr/**'
      - '.github/workflows/conformance.yml'

permissions:
  contents: read
  issues: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The generated node does not exist until the generator has emitted it.
      # Skip rather than fail so the badge stays honest.
      - name: Is there a node to check yet?
        id: gate
        run: |
          if [ -f packages/n8n-nodes-vultr/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No generated node yet, skipping conformance check."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - name: Conformance check against live vendor API
        id: check
        if: steps.gate.outputs.ready == 'true'
        env:
          # Name matches what the generated test reads. driftnode derives it
          # from the auth scheme: bearer_token gives <VENDOR>_ACCESS_TOKEN,
          # api_key gives <VENDOR>_API_KEY. Vultr uses bearer.
          VULTR_ACCESS_TOKEN: ${{ secrets.VULTR_ACCESS_TOKEN }}
        run: npm run conformance

      # Only the conformance step itself means drift. `if: failure()` was wrong:
      # it also fired when checkout, install or build failed, so an unrelated
      # broken build reported itself to the world as a vendor API change. That
      # is the one mistake a drift detector cannot afford to make, because a
      # detector that cries wolf gets muted and then detects nothing.
      - name: Open an issue on drift
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Vendor API drift detected';
            const body = [
              'The scheduled conformance check failed, which means the vendor API no longer',
              'matches the contract the node was generated from.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['drift'],
              });
            }
